<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>WB Machine Skill & Work Readiness Matrix</title>
<style>
:root{--bg:#E9EEF5;--card:#fff;--ink:#14213D;--mut:#5b6877;--navy:#0E2A5C;--row:#EEF4FA;--line:#d7e0ea;--inp:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#0b1220;--card:#131c2e;--ink:#e8eef8;--mut:#9bacc3;--navy:#0a1f45;--row:#182339;--line:#26354f;--inp:#0f1727}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,"Segoe UI",Tahoma,sans-serif}
#app{max-width:1280px;margin:0 auto;padding:16px}
header{background:var(--navy);color:#fff;border-radius:16px;padding:18px 22px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
h1{margin:0;font-size:clamp(18px,3vw,30px)}#sub{color:#FFC933;font-weight:700;margin-top:4px}
#legend{background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;display:flex;gap:12px;flex-wrap:wrap;font-size:12px}
#legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
nav{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin:12px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px}
button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.scroll{overflow-x:auto;background:var(--card);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:760px}
th{background:var(--navy);color:#fff;padding:8px;font-size:12px;text-align:center}
td{padding:8px;text-align:center;border-top:1px solid var(--line)}tr:nth-child(even) td{background:var(--row)}
td.n,th.n{text-align:left}td.n b{display:block}td.n small{color:var(--mut)}
th.sk img{height:54px;display:block;margin:0 auto 4px;background:#fff;border-radius:6px;padding:2px}.ph{height:54px;display:grid;place-items:center;font-size:26px}
.v{font-size:20px;font-weight:800}.heat{color:#fff;font-weight:800;font-size:18px}
.pill{display:inline-block;padding:5px 14px;border-radius:99px;font-weight:700;font-size:13px}
.bars{display:flex;gap:3px;align-items:flex-end;justify-content:center;height:40px}.bars i{width:12px;display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--line)}.card h4{margin:0}.card small{color:var(--mut)}
.card .top{display:flex;justify-content:space-between;align-items:center}
#sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:14px}
.kpi{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--line)}.kpi b{display:block;font-size:30px}.kpi span{color:var(--mut);font-size:12px}
.team{grid-column:1/-1}.tb{display:grid;grid-template-columns:130px 1fr 44px;gap:8px;align-items:center;margin:6px 0}.tb div.bg{background:var(--row);border-radius:6px;height:16px}.tb div.bg i{display:block;height:100%;border-radius:6px}
#cfg{background:var(--card);border-radius:14px;padding:16px;margin-top:14px;border:1px solid var(--line)}#cfg[hidden]{display:none}
#cfg h2,#cfg h3{margin:12px 0 8px}.row{display:flex;gap:10px;flex-wrap:wrap}label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
input,select,textarea{font:inherit;background:var(--inp);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.ct td,.ct th{padding:4px}.ct input{width:100%}.ct input[type=number]{width:64px}.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.chip{display:flex;gap:2px}
textarea{width:100%;font-family:monospace;font-size:12px;margin:6px 0}#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:10px;display:none}
</style></head><body><div id="app">
<header><div><h1 id="ttl"></h1><div id="sub"></div></div><div id="legend"></div></header>
<nav><div id="tabs"></div><div><button data-a="cfg">⚙ Config</button> <button data-a="thm">◐ Theme</button> <button data-a="png">▧ Export PNG</button></div></nav>
<main id="view"></main><section id="sum"></section><section id="cfg" hidden></section><div id="toast"></div></div>

const avg=t=>S.skills.length?S.skills.reduce((a,_,i)=>a+(+t.v[i]||0),0)/S.skills.length:0;
const base=t=>S.basis<0?avg(t):(+t.v[S.basis]||0);
function st(t){const b=base(t),h=S.th;return b>=h.r?['Ready','#1E9E4A','#fff']:b>=h.s?['Supervised','#FFD21F','#222']:b>=h.t?['Training','#F58220','#fff']:['Basic','#E53935','#fff']}
const col=v=>v>=S.th.r?'#1E9E4A':v>=(S.th.r+S.th.s)/2?'#7DA318':v>=S.th.s?'#E3A008':'#E4572E';
const pill=t=>{const s=st(t);return`<span class="pill" style="background:${s[1]};color:${s[2]}">${s[0]}</span>`};
function dur(j){const a=new Date(j),n=new Date();if(isNaN(a))return'–';let y=n.getFullYear()-a.getFullYear(),m=n.getMonth()-a.getMonth(),d=n.getDate()-a.getDate();if(d<0){m--;d+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(m<0){y--;m+=12}return`${y} Y ${m} M ${d} D`}
function table(heat){const rows=heat?[...S.techs].sort((a,b)=>avg(b)-avg(a)):S.techs;
let h='<div class="scroll"><table><thead><tr><th class="n">Technician</th><th>Joined</th><th>Duration</th>'+S.skills.map(k=>`<th class="sk">${k.img&&IM[k.img]?`<img src="${IM[k.img]}" alt="">`:'<div class="ph">⚙</div>'}${E(k.n)}</th>`).join('')+'<th>Overall</th>'+(heat?'':'<th>Profile</th>')+'<th>Status</th></tr></thead><tbody>';
for(const t of rows){h+=`<tr><td class="n"><b>${E(t.name)}</b><small>${E(t.id)}</small></td><td>${E(t.join)}</td><td>${dur(t.join)}</td>`+S.skills.map((_,i)=>{const v=+t.v[i]||0;return heat?`<td class="heat" style="background:${col(v)}">${v}%</td>`:`<td class="v" style="color:${col(v)}">${v}%</td>`}).join('')+`<td class="v">${avg(t).toFixed(1)}%</td>`+(heat?'':`<td><div class="bars">${S.skills.map((_,i)=>{const v=+t.v[i]||0;return`<i title="${v}%" style="height:${Math.max(2,v*.4)}px;background:${col(v)}"></i>`}).join('')}</div></td>`)+`<td>${pill(t)}</td></tr>`}
return h+'</tbody></table></div>'}
function radar(t){const n=S.skills.length;if(n<3)return'';const c=100,R=70,p=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[c+r*Math.cos(a),c+r*Math.sin(a)]};
const g=[.33,.66,1].map(f=>`<polygon points="${S.skills.map((_,i)=>p(i,R*f).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`).join('');
const pts=S.skills.map((_,i)=>p(i,R*Math.min(100,+t.v[i]||0)/100).join(',')).join(' ');
const lb=S.skills.map((k,i)=>{const[x,y]=p(i,R+16);return`<text x="${x}" y="${y}" font-size="9" text-anchor="middle" dominant-baseline="middle" fill="currentColor">${E(k.n.split(' ')[0])}</text>`}).join('');
return`<svg viewBox="0 0 200 200" width="100%" style="max-width:220px;display:block;margin:auto">${g}<polygon points="${pts}" fill="#4DD0E1" fill-opacity=".35" stroke="#1597a8" stroke-width="2"/>${lb}</svg>`}
function cards(){return'<div class="cards">'+[...S.techs].sort((a,b)=>avg(b)-avg(a)).map(t=>`<div class="card"><div class="top"><div><h4>${E(t.name)}</h4><small>${E(t.id)} · ${dur(t.join)}</small></div>${pill(t)}</div>${radar(t)}<div style="text-align:center;font-size:22px;font-weight:800">${avg(t).toFixed(1)}%</div></div>`).join('')+'</div>'}
function draw(){$('#ttl').textContent=S.title;$('#sub').textContent=S.sub;
$('#legend').innerHTML=`<b>Status${S.basis<0?' (overall)':' ('+E(S.skills[S.basis]?.n)+')'}</b>`+[['Ready','#1E9E4A',`≥${S.th.r}%`],['Supervised','#FFD21F',`${S.th.s}–${S.th.r-1}%`],['Training','#F58220',`${S.th.t}–${S.th.s-1}%`],['Basic','#E53935',`<${S.th.t}%`]].map(a=>`<span><i style="background:${a[1]}"></i>${a[0]} ${a[2]}</span>`).join('');
$('#tabs').innerHTML=[['matrix','Matrix'],['heat','Heatmap'],['cards','Radar cards']].map(a=>`<button data-v="${a[0]}" class="${S.view===a[0]?'on':''}">${a[1]}</button>`).join(' ');
$('#view').innerHTML=S.view==='cards'?cards():table(S.view==='heat');
const N=S.techs.length,cnt=k=>S.techs.filter(t=>st(t)[0]===k).length,ta=N?S.techs.reduce((a,t)=>a+avg(t),0)/N:0;
$('#sum').innerHTML=[['Technicians',N,''],['Average overall',ta.toFixed(1)+'%','#1E9E4A'],['Ready',cnt('Ready'),'#1E9E4A'],['Supervised',cnt('Supervised'),'#E3A008'],['Training / Basic',cnt('Training')+cnt('Basic'),'#F58220']].map(a=>`<div class="kpi"><b style="color:${a[2]}">${a[1]}</b><span>${a[0]}</span></div>`).join('')+
'<div class="kpi team"><b style="font-size:16px">Team average by skill</b>'+S.skills.map((k,i)=>{const v=N?S.techs.reduce((a,t)=>a+(+t.v[i]||0),0)/N:0;return`<div class="tb"><span>${E(k.n)}</span><div class="bg"><i style="width:${v}%;background:${col(v)}"></i></div><b>${v.toFixed(0)}%</b></div>`}).join('')+'</div>'}
function cfg(){const sk=S.skills,i=(a,b)=>a;$('#cfg').hidden=!cfgOpen;if(!cfgOpen)return;
$('#cfg').innerHTML=`<h2>Configuration</h2><div class="row"><label>Title<input data-m="title" value="${E(S.title)}" size="40"></label><label>Subtitle<input data-m="sub" value="${E(S.sub)}" size="30"></label></div>
<div class="row" style="margin-top:8px"><label>Ready ≥ (%)<input type="number" data-th="r" value="${S.th.r}"></label><label>Supervised ≥ (%)<input type="number" data-th="s" value="${S.th.s}"></label><label>Training ≥ (%)<input type="number" data-th="t" value="${S.th.t}"></label><label>Status based on<select data-basis="1"><option value="-1" ${S.basis<0?'selected':''}>Overall average</option>${sk.map((k,j)=>`<option value="${j}" ${S.basis==j?'selected':''}>${E(k.n)}</option>`).join('')}</select></label></div>
<h3>Skills (columns)</h3><div class="chips">${sk.map((k,j)=>`<span class="chip"><input data-sk="${j}" value="${E(k.n)}"><button data-delsk="${j}" title="Remove">×</button></span>`).join('')}<button data-a="addsk">+ Add skill</button></div>
<h3>Technicians</h3><div class="scroll"><table class="ct"><tr><th>Name</th><th>ID</th><th>Join date</th>${sk.map(k=>`<th>${E(k.n)} %</th>`).join('')}<th></th></tr>${S.techs.map((t,r)=>`<tr><td><input data-t="${r}" data-f="name" value="${E(t.name)}"></td><td><input data-t="${r}" data-f="id" value="${E(t.id)}" size="8"></td><td><input type="date" data-t="${r}" data-f="join" value="${E(t.join)}"></td>${sk.map((_,j)=>`<td><input type="number" min="0" max="100" data-t="${r}" data-f="v" data-j="${j}" value="${+t.v[j]||0}"></td>`).join('')}<td><button data-delt="${r}" title="Remove">🗑</button></td></tr>`).join('')}</table></div>
<p><button data-a="addt">+ Add technician</button></p><h3>Data</h3><textarea id="jt" rows="5" placeholder="Export fills this box; paste JSON here and press Import"></textarea><button data-a="exp">Export JSON</button> <button data-a="imp">Import JSON</button> <button data-a="rst">Reset to defaults</button>`}
function poster(){
const N=S.techs.length,cnt=k=>S.techs.filter(t=>st(t)[0]===k).length,ta=N?S.techs.reduce((a,t)=>a+avg(t),0)/N:0,h=S.th,bn=S.basis<0?'overall':(S.skills[S.basis]?.n||'key area'),pc=n=>N?(n/N*100).toFixed(1):'0.0',n=S.skills.length;
const css='<style>.xp{width:1920px;padding:30px;background:#E9EEF5;font-family:Arial,"Segoe UI",Tahoma,sans-serif;color:#14213D}.xp *{box-sizing:border-box}.xp table{border-collapse:collapse;width:100%}.xp th{background:#0E2A5C;color:#fff;padding:10px 8px;font-size:17px;text-align:center;border-left:1px solid #1d4080}.xp td{padding:6px 8px;text-align:center;border-top:1px solid #d7e0ea;background:#fff;height:64px;font-size:18px}.xp tr:nth-child(even) td{background:#EEF4FA}.xp .l{text-align:left;color:#0E2A5C}.xp .l b{display:block;font-size:19px}.xp .l span{font-size:16px}.xp .v{font-size:28px;font-weight:800}.xp img{height:92px;background:#fff;display:block;margin:0 auto 6px;border-radius:6px}.xp .pl{display:inline-block;padding:8px 20px;border-radius:99px;font-weight:700;font-size:17px}.xp .b{display:flex;gap:6px;align-items:flex-end;justify-content:center;height:58px}.xp .b div{width:28px;text-align:center;font-size:10px;color:#444}.xp .b i{display:block;width:28px;margin-bottom:2px}.xp .st{text-align:center;flex:1}.xp .st b{display:block;font-size:40px}.xp .st span{font-size:15px;color:#333}</style>';
const gear='<svg width="84" height="84" viewBox="0 0 100 100"><circle cx="50" cy="50" r="27" fill="none" stroke="#fff" stroke-width="14"/><g fill="#fff"><rect x="42" y="4" width="16" height="92" rx="4"/><rect x="42" y="4" width="16" height="92" rx="4" transform="rotate(45 50 50)"/><rect x="42" y="4" width="16" height="92" rx="4" transform="rotate(90 50 50)"/><rect x="42" y="4" width="16" height="92" rx="4" transform="rotate(135 50 50)"/></g></svg>';
const lg=[['Ready','#1E9E4A',`≥${h.r}%`],['Supervised','#FFD21F',`${h.s}–${h.r-1}%`],['Training','#F58220',`${h.t}–${h.s-1}%`],['Basic','#E53935',`<${h.t}%`]].map(a=>`<div style="text-align:center;font-size:16px"><span style="display:inline-block;width:16px;height:16px;border-radius:50%;background:${a[1]};margin-right:6px;vertical-align:-2px"></span><b>${a[0]}</b><div style="color:#555">${a[2]}</div></div>`).join('');
const head=`<div style="background:#0E2A5C;border-radius:22px;padding:22px 34px;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><div style="display:flex;gap:26px;align-items:center">${gear}<div><div style="color:#fff;font-size:46px;font-weight:800">${E(S.title)}</div><div style="color:#FFC933;font-size:26px;font-weight:700;margin-top:4px">${E(S.sub)}</div></div></div><div style="background:#fff;border-radius:16px;padding:12px 26px"><div style="text-align:center;font-weight:800;color:#0E2A5C;font-size:17px;margin-bottom:8px">WORK READINESS STATUS</div><div style="display:flex;gap:28px">${lg}</div></div></div>`;
const th2=S.skills.map(k=>`<th>${k.img&&IM[k.img]?`<img src="${IM[k.img]}" alt="">`:'<div style="height:92px;font-size:44px">⚙</div>'}${E(k.n)}</th>`).join('');
const rows=S.techs.map(t=>{const s=st(t);return`<tr><td class="l"><b>${E(t.name)}</b><span>${E(t.id)}</span></td><td>${E(t.join)}</td><td>${dur(t.join)}</td>`+S.skills.map((_,i)=>{const v=+t.v[i]||0;return`<td class="v" style="color:${col(v)}">${v}%</td>`}).join('')+`<td class="v" style="color:#0E2A5C">${avg(t).toFixed(1)}%</td><td><div class="b">${S.skills.map((_,i)=>{const v=+t.v[i]||0;return`<div><i style="height:${Math.max(3,v*.4)}px;background:${col(v)}"></i>${v}%</div>`}).join('')}</div></td><td><span class="pl" style="background:${s[1]};color:${s[2]}">${s[0]}</span></td></tr>`}).join('');
const tbl=`<table><thead><tr><th rowspan="2" style="width:250px">Technician<br>Name</th><th rowspan="2" style="width:150px">Date Join to<br>RX Engineering</th><th rowspan="2" style="width:160px">Employment<br>Duration</th><th colspan="${n}">EQUIPMENT SKILL (%)</th><th rowspan="2" style="width:140px">OVERALL<br>SKILL<br><small>(Average)</small></th><th rowspan="2" style="width:${Math.max(190,n*36+20)}px">SKILL PROFILE<br>(CHART)</th><th rowspan="2" style="width:190px">WORK<br>READINESS<br>STATUS</th></tr><tr>${th2}</tr></thead><tbody>${rows}</tbody></table>`;
const sts=[[N,'Total Technicians','Persons','#0E2A5C'],[ta.toFixed(1)+'%','Average Overall Skill','','#1E9E4A'],...[['Ready','#1E9E4A',`Ready (≥${h.r}% ${E(bn)})`],['Supervised','#E3A008',`Supervised (${h.s}–${h.r-1}%)`],['Training','#F58220',`Training (${h.t}–${h.s-1}%)`],['Basic','#E53935',`Basic (<${h.t}%)`]].map(a=>[cnt(a[0]),a[2],`Persons (${pc(cnt(a[0]))}%)`,a[1]])];
const foot=`<div style="display:flex;gap:18px;margin-top:18px"><div style="background:#fff;border-radius:18px;padding:18px 24px;width:600px;font-size:15px;line-height:1.7"><b style="font-size:19px;color:#0E2A5C">NOTE:</b><br>• Skill (%) based on technician self-assessment &amp; performance evaluation<br>• Overall Skill = Average of ${n} equipment skills<br>• Work Readiness (${E(bn)}): ≥${h.r}% Ready | ${h.s}–${h.r-1}% Supervised | ${h.t}–${h.s-1}% Training | &lt;${h.t}% Basic</div><div style="background:#fff;border-radius:18px;padding:16px 20px;flex:1"><div style="text-align:center;font-weight:800;color:#0E2A5C;font-size:17px;margin-bottom:8px">TEAM SUMMARY</div><div style="display:flex">${sts.map(a=>`<div class="st"><b style="color:${a[3]}">${a[0]}</b><span>${a[1]}<br>${a[2]}</span></div>`).join('')}</div></div></div>`;
return`<div class="xp">${css}${head}<div style="background:#fff;border-radius:18px;overflow:hidden">${tbl}</div>${foot}</div>`}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
function save(){clearTimeout(T);T=setTimeout(async()=>{const j=JSON.stringify(S);try{localStorage.setItem('wbskill',j)}catch(e){}if(ref){try{await ref.set({json:j})}catch(e){toast('Saved on this device only (no permission to share)')}}},600)}
document.addEventListener('input',e=>{const d=e.target.dataset,x=e.target.value;if(d.m)S[d.m]=x;else if(d.th)S.th[d.th]=+x||0;else if(d.t!==undefined){const t=S.techs[d.t];if(d.f==='v')t.v[d.j]=Math.max(0,Math.min(100,+x||0));else t[d.f]=x}else if(d.sk!==undefined)S.skills[d.sk].n=x;else return;draw();save()});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d.basis){S.basis=+e.target.value;draw();save()}if(d.sk!==undefined)cfg()});
let rs=0;document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;let ch=1;
if(d.v)S.view=d.v;else if(d.delt!==undefined)S.techs.splice(d.delt,1);else if(d.delsk!==undefined){S.skills.splice(d.delsk,1);S.techs.forEach(t=>t.v.splice(d.delsk,1));if(S.basis>=S.skills.length)S.basis=0}
else if(d.a==='addsk'){S.skills.push({n:'New skill'});S.techs.forEach(t=>t.v.push(0))}else if(d.a==='addt')S.techs.push(V('New technician','',new Date().toISOString().slice(0,10),S.skills.map(()=>0)));
else if(d.a==='cfg'){cfgOpen=!cfgOpen;ch=0;cfg();return}else if(d.a==='thm'){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';return}
else if(d.a==='png'){
  if(typeof html2canvas!=='function'){toast('PNG export library did not load. Check internet connection.');return}
  toast('กำลังสร้างไฟล์ PNG...');
  const host=document.createElement('div');host.id='xp';host.style.cssText='position:absolute;left:-10000px;top:0;width:1920px';host.innerHTML=poster();document.body.appendChild(host);const app=host;
  html2canvas(app,{backgroundColor:'#E9EEF5',scale:2,useCORS:true,logging:false,
    onclone:c=>{const x=c.querySelector('#xp');if(x){x.style.left='0';x.style.top='0'}},
    windowWidth:1920,scrollX:0,scrollY:0
  }).then(canvas=>canvas.toBlob(async blob=>{
    const fn='WB_Machine_Skill_Matrix.png',dl=await window.claude?.use?.('downloads');
    if(dl){try{await dl.save({filename:fn,data:blob});toast('ดาวน์โหลด PNG เรียบร้อย')}catch(e){toast('ยกเลิกการบันทึกไฟล์')}}
    else{const a=document.createElement('a');a.download=fn;a.href=URL.createObjectURL(blob);a.click();toast('ดาวน์โหลด PNG เรียบร้อย')}
  },'image/png')).catch(err=>{console.error(err);toast('Export PNG ไม่สำเร็จ')}).finally(()=>host.remove());
  return
}
else if(d.a==='exp'){$('#jt').value=JSON.stringify(S,null,1);return}
else if(d.a==='imp'){try{const o=JSON.parse($('#jt').value);if(!Array.isArray(o.techs)||!Array.isArray(o.skills))throw 0;S=Object.assign({},DEF,o)}catch(x){toast('Invalid JSON');return}}
else if(d.a==='rst'){if(!rs){rs=1;b.textContent='Click again to confirm';return}rs=0;S=structuredClone(DEF)}else return;
draw();cfg();save()});
document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
draw();
(async()=>{try{const db=await window.claude?.use('db');if(!db)return;ref=db.doc('config/main');const s=await ref.get();if(s.exists&&s.data().json){S=Object.assign({},DEF,JSON.parse(s.data().json));draw();cfg()}}catch(e){}})();
</script></body></html>
