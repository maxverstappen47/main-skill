<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WB Machine Skill & Work Readiness Matrix</title>
<!-- เพิ่ม FontAwesome สำหรับไอคอนต่างๆ -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --bg: #E9EEF5;
  --card: #fff;
  --ink: #333;
  --navy: #002855;
  --blue-text: #0056b3;
  --line: #c0c0c0;
  box-sizing: border-box;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Segoe UI", Tahoma, sans-serif; padding: 20px; }
#app { max-width: 1400px; margin: 0 auto; }

/* Control Nav (จะไม่โชว์ในภาพ Export) */
nav.controls { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 12px; }
button { font: inherit; cursor: pointer; border: 1px solid #bbb; background: #fff; color: #333; border-radius: 6px; padding: 8px 14px; font-weight: bold; transition: 0.2s; }
button:hover { background: #f0f0f0; }
button[data-a="png"] { background: var(--navy); color: #fff; border-color: var(--navy); }
button[data-a="png"]:hover { background: #003b80; }

/* Dashboard Layout (ส่วนที่จะ Export) */
#export-wrap { background: #fff; padding: 2px; border: 1px solid #999; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
.top-banner { display: flex; justify-content: space-between; background: var(--navy); color: #fff; padding: 12px 20px; align-items: center; }
.top-banner .title-area { display: flex; align-items: center; gap: 15px; }
.top-banner .title-area i { font-size: 40px; }
.top-banner h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: 0.5px; }
.top-banner h2 { margin: 4px 0 0; font-size: 14px; color: #FFC933; font-weight: 600; }

.legend-box { background: #fff; color: #333; padding: 6px 12px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.legend-box .lg-title { text-align: center; font-size: 10px; font-weight: 800; margin-bottom: 4px; color: var(--navy); }
.legend-box .dots { display: flex; gap: 12px; text-align: center; }
.legend-box .dots span { display: inline-block; line-height: 1.2; }
.legend-box .dots i { margin-right: 3px; font-size: 10px; }

/* Table Styling */
table.matrix { width: 100%; border-collapse: collapse; text-align: center; font-size: 13px; }
table.matrix th, table.matrix td { border: 1px solid var(--line); padding: 8px 4px; vertical-align: middle; }
table.matrix thead th { background: var(--navy); color: #fff; font-size: 12px; font-weight: 600; }
table.matrix thead .sk-row th { background: #fff; color: var(--navy); padding: 4px; }
table.matrix thead .sk-row img { height: 45px; display: block; margin: 4px auto 0; }
table.matrix tbody tr:nth-child(even) { background: #EEF4FA; }
table.matrix tbody tr:nth-child(odd) { background: #fff; }

.tech-name { text-align: left !important; padding-left: 10px !important; }
.tech-name b { color: var(--blue-text); display: block; font-size: 13px; margin-bottom: 2px; }
.tech-name small { color: #666; font-size: 11px; }

.val-txt { font-size: 15px; font-weight: 800; }
.chart-box { display: flex; gap: 4px; justify-content: center; align-items: flex-end; height: 35px; }
.chart-col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; width: 14px; }
.chart-col i { display: block; width: 10px; border-radius: 1px; }
.chart-col span { font-size: 8px; color: #555; margin-top: 2px; font-weight: bold; }

.s-box { display: inline-flex; align-items: center; justify-content: flex-start; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; width: 95px; border: 1px solid #ccc; gap: 6px; box-shadow: 1px 1px 3px rgba(0,0,0,0.1); }
.s-box.rdy { background: #fff; color: #1E9E4A; border-color: #1E9E4A; }
.s-box.sup { background: #FFD21F; color: #111; border-color: #d4af37; }
.s-box.trn { background: #F58220; color: #fff; border-color: #cc6600; }
.s-box.bas { background: #E53935; color: #fff; border-color: #b71c1c; }

/* Footer Summary */
.footer-panel { display: flex; border: 1px solid var(--line); border-top: none; background: #fff; }
.note-box { flex: 1; padding: 12px; font-size: 10px; color: #555; border-right: 1px solid var(--line); line-height: 1.6; }
.note-box b { color: var(--navy); font-size: 11px; }
.sum-box { flex: 2.8; display: flex; align-items: stretch; }
.sum-title { background: var(--navy); color: #fff; font-size: 11px; font-weight: bold; display: flex; align-items: center; justify-content: center; padding: 0 10px; text-align: center; line-height: 1.2; }
.sum-stats { display: flex; flex: 1; justify-content: space-around; align-items: center; padding: 10px; }
.stat-item { text-align: center; }
.stat-item i { font-size: 26px; margin-bottom: 4px; }
.stat-item b { display: block; font-size: 18px; margin: 2px 0; }
.stat-item span { font-size: 10px; color: #555; display: block; line-height: 1.1; }

/* Config Panel */
#cfg { background: #fff; border-radius: 8px; padding: 16px; margin-top: 20px; border: 1px solid var(--line); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
#cfg[hidden] { display: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
label { display: flex; flex-direction: column; font-size: 12px; color: #555; gap: 4px; }
input, select, textarea { font: inherit; background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 6px 8px; }
.ct th { text-align: left; font-size: 12px; }
.ct input[type=number] { width: 60px; }
textarea { width: 100%; font-family: monospace; font-size: 12px; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 20px; border-radius: 8px; display: none; font-weight: bold; z-index: 999; }
</style>
</head>
<body>
<div id="app">
  <nav class="controls" data-html2canvas-ignore="true">
    <button data-a="cfg"><i class="fa-solid fa-gear"></i> Config Data</button>
    <button data-a="png"><i class="fa-solid fa-image"></i> Export PNG</button>
  </nav>

  <div id="export-wrap">
    <div id="view"></div>
  </div>

  <section id="cfg" hidden></section>
</div>
<div id="toast"></div>

th:{r:70,s:50,t:30}, basis: -1};

let S=structuredClone(DEF);
try{const j=localStorage.getItem('wbskill_v2');if(j)S=Object.assign({},DEF,JSON.parse(j))}catch(e){}
const \$=s=>document.querySelector(s), E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const avg=t=>S.skills.length ? S.skills.reduce((a,_,i)=>a+(+t.v[i]||0),0)/S.skills.length : 0;
const col=v=>v>=S.th.r?'#1E9E4A':v>=S.th.s?'#FFC933':v>=S.th.t?'#F58220':'#E53935';

function stBox(t) {
  const b = avg(t), h = S.th;
  if(b >= h.r) return `<div class="s-box rdy"><i class="fa-solid fa-circle-check"></i> Ready</div>`;
  if(b >= h.s) return `<div class="s-box sup"><i class="fa-solid fa-user"></i> Supervised</div>`;
  if(b >= h.t) return `<div class="s-box trn"><i class="fa-solid fa-graduation-cap"></i> Training</div>`;
  return `<div class="s-box bas"><i class="fa-solid fa-book"></i> Basic</div>`;
}

function dur(j) {
  const a=new Date(j), n=new Date();
  if(isNaN(a)) return '–';
  let y = n.getFullYear()-a.getFullYear(), m = n.getMonth()-a.getMonth(), d = n.getDate()-a.getDate();
  if(d<0) { m--; d+=new Date(n.getFullYear(),n.getMonth(),0).getDate(); }
  if(m<0) { y--; m+=12; }
  return `${y} Y ${m} M ${d} D`;
}

function profileChart(t) {
  return `<div class="chart-box">${S.skills.map((_,i)=>{
      const v = +t.v[i]||0;
      return `<div class="chart-col"><i title="${v}%" style="height:${Math.max(2, v*0.25)}px; background:${col(v)};"></i><span>${v}%</span></div>`
  }).join('')}</div>`;
}

function draw() {
  const N = S.techs.length;
  const ta = N ? S.techs.reduce((a,t)=>a+avg(t),0)/N : 0;
  const cnt = k => {
      return S.techs.filter(t => {
          const b = avg(t);
          if (k==='Ready') return b >= S.th.r;
          if (k==='Supervised') return b >= S.th.s && b < S.th.r;
          if (k==='Training') return b >= S.th.t && b < S.th.s;
          return b < S.th.t;
      }).length;
  };

  const c_r = cnt('Ready'), c_s = cnt('Supervised'), c_t = cnt('Training'), c_b = cnt('Basic');

  let h = `
  <div class="top-banner">
    <div class="title-area">
      <i class="fa-solid fa-gear"></i>
      <div>
        <h1>${E(S.title)}</h1>
        <h2>${E(S.sub)}</h2>
      </div>
    </div>
    <div class="legend-box">
       <div class="lg-title">WORK READINESS STATUS</div>
       <div class="dots">
         <span><i class="fa-solid fa-circle" style="color:#1E9E4A"></i> Ready<br>(≥${S.th.r}%)</span>
         <span><i class="fa-solid fa-circle" style="color:#FFC933"></i> Supervised<br>(${S.th.s}-${S.th.r-1}%)</span>
         <span><i class="fa-solid fa-circle" style="color:#F58220"></i> Training<br>(${S.th.t}-${S.th.s-1}%)</span>
         <span><i class="fa-solid fa-circle" style="color:#E53935"></i> Basic<br>(<${S.th.t}%)</span>
       </div>
    </div>
  </div>
  
  <table class="matrix">
    <thead>
      <tr>
        <th rowspan="2" style="width:180px;">Technician<br>Name</th>
        <th rowspan="2" style="width:110px;">Date Join to<br>RX Engineering<br><i class="fa-regular fa-calendar-days" style="font-size:16px;margin-top:6px;"></i></th>
        <th rowspan="2" style="width:100px;">Employment<br>Duration<br><i class="fa-regular fa-clock" style="font-size:16px;margin-top:6px;"></i></th>
        <th colspan="${S.skills.length}" style="border-bottom:1px solid #fff;">EQUIPMENT SKILL (%)</th>
        <th rowspan="2" style="width:80px;">OVERALL<br>SKILL<br><small style="font-weight:normal">(Average)</small></th>
        <th rowspan="2" style="width:160px;">SKILL PROFILE<br>(CHART)</th>
        <th rowspan="2" style="width:120px;">WORK<br>READINESS<br>STATUS</th>
      </tr>
      <tr class="sk-row">
        ${S.skills.map(k=>`<th>${E(k.n)}${k.img&&IM[k.img]?`<img src="${IM[k.img]}">`:''}</th>`).join('')}
      </tr>
    </thead>
    <tbody>
      ${S.techs.map(t=>`
      <tr>
        <td class="tech-name"><b>${E(t.name)}</b><small>${E(t.id)}</small></td>
        <td>\${E(t.join)}</td>
        <td>${dur(t.join)}</td>${S.skills.map((_,i)=>{
            const v=+t.v[i]||0;
            return `<td class="val-txt" style="color:${col(v)}">${v}%</td>`
        }).join('')}
        <td class="val-txt" style="color:${col(avg(t))}">${avg(t).toFixed(1)}%</td>
        <td>\${profileChart(t)}</td>
        <td>\${stBox(t)}</td>
      </tr>
      `).join('')}
    </tbody>
  </table>
  
  <div class="footer-panel">
    <div class="note-box">
      <b>NOTE:</b><br>
      • Skill (%) based on technician self-assessment & performance evaluation<br>
      • Overall Skill = Average of ${S.skills.length} equipment skills<br>
      • Work Readiness : ≥${S.th.r}% Ready | ${S.th.s}-${S.th.r-1}% Supervised | ${S.th.t}-${S.th.s-1}% Training | <${S.th.t}% Basic
    </div>
    <div class="sum-box">
      <div class="sum-title">TEAM<br>SUMMARY</div>
      <div class="sum-stats">
         <div class="stat-item"><i class="fa-solid fa-users" style="color:var(--navy);"></i><span>Total Technicians</span><b>${N}</b><span>Persons</span></div>
         <div class="stat-item"><i class="fa-solid fa-bullseye" style="color:#1E9E4A;"></i><span>Average Overall Skill</span><b style="color:#1E9E4A">${ta.toFixed(1)}%</b></div>
         <div class="stat-item"><i class="fa-solid fa-circle-check" style="color:#1E9E4A;"></i><span>Technicians Ready<br>(≥${S.th.r}%)</span><b style="color:#1E9E4A">${c_r}</b><span>Persons (${N?(c_r/N*100).toFixed(1):0}%)</span></div>

         <div class="stat-item"><i class="fa-solid fa-graduation-cap" style="color:#F58220;"></i><span>Training<br>(${S.th.t}-${S.th.s-1}%)</span><b style="color:#F58220">${c_t}</b><span>Persons (${N?(c_t/N*100).toFixed(1):0}%)</span></div>
         <div class="stat-item"><i class="fa-solid fa-book" style="color:#E53935;"></i><span>Basic<br>(<${S.th.t}%)</span><b style="color:#E53935">${c_b}</b><span>Persons (${N?(c_b/N*100).toFixed(1):0}%)</span></div>
      </div>
    </div>
  </div>`;
  
  \$('#view').innerHTML = h;
}

      `).join('')}
      <button data-a="addsk">+ Add skill</button>
    </div>
    <h3>Technicians</h3>
    <div style="overflow-x:auto;">
      <table class="ct" style="width:100%; border-collapse:collapse;">
        <tr><th>Name</th><th>ID</th><th>Join Date</th>${sk.map(k=>`<th>\${E(k.n)}</th>`).join('')}<th></th></tr>
        ${S.techs.map((t,r)=>`
          <tr>
            <td><input data-t="${r}" data-f="name" value="${E(t.name)}"></td>
            <td><input data-t="${r}" data-f="id" value="${E(t.id)}" size="6"></td>
            <td><input type="date" data-t="${r}" data-f="join" value="${E(t.join)}"></td>
            \${sk.map((_,j)=>`<td><input type="number" min="0" max="100" data-t="${r}" data-f="v" data-j="${j}" value="${+t.v[j]||0}"></td>`).join('')}
            <td><button data-delt="\${r}">🗑</button></td>
          </tr>
        `).join('')}
      </table>
    </div>
    <br><button data-a="addt">+ Add technician</button>
  `;
}

function toast(m) {
  const t=\$('#toast'); t.textContent=m; t.style.display='block';
  setTimeout(()=>t.style.display='none', 3000);
}
let T, cfgOpen = false;
function save() {
  clearTimeout(T);
  T=setTimeout(()=>{ localStorage.setItem('wbskill_v2', JSON.stringify(S)); }, 600);
}

document.addEventListener('input', e=>{
  const d=e.target.dataset, x=e.target.value;
  if(d.m) S[d.m]=x;
  else if(d.th) S.th[d.th]=+x||0;
  else if(d.t!==undefined){
    const t=S.techs[d.t];
    if(d.f==='v') t.v[d.j]=Math.max(0,Math.min(100,+x||0)); else t[d.f]=x;
  }
  else if(d.sk!==undefined) S.skills[d.sk].n=x;
  else return;
  draw(); save();
});

document.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  const d=b.dataset;
  
  if(d.a==='cfg') { cfgOpen=!cfgOpen; cfg(); return; }
  if(d.delt!==undefined) S.techs.splice(d.delt,1);
  else if(d.delsk!==undefined){ S.skills.splice(d.delsk,1); S.techs.forEach(t=>t.v.splice(d.delsk,1)); }
  else if(d.a==='addsk'){ S.skills.push({n:'New skill'}); S.techs.forEach(t=>t.v.push(0)); }
  else if(d.a==='addt') S.techs.push(V('New technician','',new Date().toISOString().slice(0,10),S.skills.map(()=>0)));
  else if(d.a==='png') {
    toast('กำลังสร้างไฟล์รูปภาพ...');
    html2canvas(document.querySelector('#export-wrap'), {
      scale: 2,
      useCORS: true,
      backgroundColor: '#ffffff'
    }).then(canvas => {
      const link = document.createElement('a');
      link.download = 'WB_Machine_Skill_Matrix_Update.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
    return;
  } else return;
  
  draw(); cfg(); save();
});

draw();
</script>
</body>
</html>
